[project]
name = "mvtec-anomaly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikoleta Papadopoulou", email = "nikolpanpap@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib[core,openvino]>=2.0.0",
    "dotenv>=0.9.9",
    "kornia>=0.8.3",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "openvino<2026",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tifffile>=2026.9.20",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
mvtec-anomaly = "mvtec_anomaly:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
